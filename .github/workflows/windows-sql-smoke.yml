# Free GitHub Actions only. Pin windows-2022: ships VS/SQL LocalDB reliably.
# windows-latest (2025) may omit SqlLocalDB; Chocolatey fallback is flaky (504).
# Uses SQL Server Express LocalDB + Windows Authentication — no SA password, no repo secrets.
# Jobs:
#   build-and-unit — explicit dotnet build + xUnit (Drive/SMTP mocked; no secrets)
#   smoke — LocalDB + --apply-basit + --backup (headless; WinForms GUI N/A in CI)
name: windows-sql-smoke

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'backup.master.sql'
      - 'basit-ayarlar.json'
      - 'setup.ps1'
      - 'setup-server.ps1'
      - 'SQLYedeklemeAraci.sln'
      - '.github/workflows/windows-sql-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'backup.master.sql'
      - 'basit-ayarlar.json'
      - 'setup.ps1'
      - 'setup-server.ps1'
      - 'SQLYedeklemeAraci.sln'
      - '.github/workflows/windows-sql-smoke.yml'
  workflow_dispatch:

concurrency:
  group: windows-sql-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (package validator)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Package validation
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          python tests\validate_package.py
          if ($LASTEXITCODE -ne 0) { throw "validate_package.py failed" }

      - name: dotnet restore / build
        shell: pwsh
        run: |
          dotnet restore SQLYedeklemeAraci.sln
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed" }
          dotnet build SQLYedeklemeAraci.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }

      - name: dotnet test (Drive/SMTP mocked — no secrets)
        shell: pwsh
        run: |
          dotnet test tests\SQLYedeklemeAraci.Tests\SQLYedeklemeAraci.Tests.csproj `
            -c Release --no-build --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }

  smoke:
    needs: build-and-unit
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (package validator)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ensure LocalDB / sqlcmd tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # windows-2022 ships SqlLocalDB with VS; still search broadly + MSI fallback.
          function Find-SqlLocalDb {
            $candidates = @(
              "${env:ProgramFiles}\Microsoft SQL Server\170\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles}\Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles}\Microsoft SQL Server\150\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles}\Microsoft SQL Server\140\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles(x86)}\Microsoft SQL Server\170\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles(x86)}\Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe",
              "${env:ProgramFiles(x86)}\Microsoft SQL Server\150\Tools\Binn\SqlLocalDB.exe"
            )
            foreach ($c in $candidates) { if (Test-Path -LiteralPath $c) { return $c } }
            $cmd = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($root in @("${env:ProgramFiles}\Microsoft SQL Server", "${env:ProgramFiles(x86)}\Microsoft SQL Server")) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Filter SqlLocalDB.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
              if ($hit) { return $hit }
            }
            return $null
          }
          function Install-SqlLocalDbMsi {
            # SQL Server 2022 Express LocalDB x64 (public Microsoft download)
            $url = 'https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SqlLocalDB.msi'
            $msi = Join-Path $env:RUNNER_TEMP 'SqlLocalDB.msi'
            Write-Host "Downloading SqlLocalDB.msi from Microsoft..."
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
            Write-Host "Installing SqlLocalDB.msi (quiet)..."
            $p = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart', 'IACCEPTSQLLOCALDBLICENSETERMS=YES') -Wait -PassThru
            Write-Host "msiexec exit: $($p.ExitCode)"
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "SqlLocalDB MSI install failed with exit $($p.ExitCode)"
            }
          }
          $ldb = Find-SqlLocalDb
          if (-not $ldb) {
            Write-Host "SqlLocalDB not on image — trying Chocolatey then MSI..."
            try {
              choco install sqllocaldb -y --no-progress
            } catch {
              Write-Host "Chocolatey install failed: $_"
            }
            $ldb = Find-SqlLocalDb
          }
          if (-not $ldb) {
            Install-SqlLocalDbMsi
            $ldb = Find-SqlLocalDb
          }
          if (-not $ldb) { throw 'SqlLocalDB.exe not available after Choco/MSI' }
          Write-Host "Using $ldb"
          # Recreate if start is flaky on hosted images (corrupt auto instance).
          function Start-LocalDbInstance {
            param([string]$Exe)
            & $Exe stop MSSQLLocalDB 2>$null | Out-Null
            & $Exe delete MSSQLLocalDB 2>$null | Out-Null
            & $Exe create MSSQLLocalDB -s
            if ($LASTEXITCODE -ne 0) { throw "sqllocaldb create -s failed ($LASTEXITCODE)" }
            for ($i = 1; $i -le 6; $i++) {
              & $Exe start MSSQLLocalDB 2>&1 | Out-Host
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "LocalDB start attempt $i failed; retrying..."
              Start-Sleep -Seconds (2 * $i)
              & $Exe stop MSSQLLocalDB 2>$null | Out-Null
            }
            throw 'LocalDB failed to start after retries'
          }
          Start-LocalDbInstance -Exe $ldb
          & $ldb info MSSQLLocalDB

      - name: Windows SQL smoke (publish + --apply-basit + --backup)
        shell: pwsh
        run: |
          ./tests/windows_sql_smoke.ps1
